# ── 멀티로봇 자동생성 (base: carter_navigation_params.yaml) ──
# namespace=carter2. 토픽 /carter2/ 접두 + initial_pose 로봇별. map=modified_hospital_map.yaml(공유).
# ※ 단일로봇 튜닝값(inflation 0.7, /scan costmap, always_send_full, max_vel_theta 1.2 등) 유지.
amcl:
  ros__parameters:
    use_sim_time: True
    # 위치 튕김(teleport)/불안정 대책: Isaac odom 은 사실상 ground-truth 라 노이즈 모델을 낮춰
    # 오도메트리를 더 신뢰 → 파티클 구름을 좁게 유지 → 대칭 복도에서 다른 위치로 리샘플 점프 방지.
    # 0.2→0.1→0.05 로 낮춤. (반대로 실로봇/odom 부정확하면 0.2 로 복귀)
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /carter2/scan
    map_topic: map
    set_initial_pose: true
    # 매 bringup 마다 initial_pose 로 강제 리셋 → 시작위치가 매번 달라지는 문제 방지(결정론적).
    # (false 면 이전 세션 잔여 pose 를 물고 시작해 매번 어긋남). initial_pose 는 Isaac 스폰의
    # 실제 map 좌표여야 함 → 아래 절차로 /amcl_pose 값을 받아 x/y/yaw 에 넣을 것.
    always_reset_initial_pose: true
    first_map_only: false
    # [2026-07-27 수정] 17_/19_ 의 "팔 베이스 도킹스테이션 중심 정렬 + 스폰방향 +Y 통일" 변경
    # (C2_START_POSE y=-0.0029517927591273807+0.2317, yaw=90°) 이 여기 반영 안 돼 있어 AMCL
    # 초기pose 가 Isaac 실제 스폰과 어긋나던 문제 수정 — 반드시 Isaac 19_ C2_START_POSE 와 일치시킬 것.
    initial_pose:                     # carter2 스폰 = Isaac CARTER_START_POSE 와 일치시킬 것
      x: 16.66290495232035
      y: 0.2287482072408726
      z: 0.0
      yaw: 1.5708

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True
